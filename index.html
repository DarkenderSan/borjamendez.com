<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borja Méndez — Fotógrafo / Videógrafo</title>

  <meta
    name="description"
    content="Borja Méndez — Fotógrafo y videógrafo en Madrid. Portfolio en actualización."
  >

  <meta property="og:title" content="Borja Méndez — Fotógrafo / Videógrafo">
  <meta property="og:description" content="Próximamente nuevo trabajo.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://borjamendez.com">

  <style>
    :root {
      --bg: #080808;
      --text: #f1f1ed;
      --muted: #777773;
      --line: rgba(255,255,255,.16);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      padding: 34px 42px 30px;

      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }

    .brand {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .role {
      justify-self: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    main {
      position: relative;
      display: flex;
      align-items: center;
    }

    .line {
      position: absolute;
      left: 0;
      top: 15%;
      width: 1px;
      height: 70%;
      background: var(--line);

      transform: scaleY(0);
      transform-origin: top;
      animation: grow 1.2s ease .2s forwards;
    }

    .hero {
      padding-left: clamp(28px, 5vw, 80px);
      max-width: 1200px;
    }

    .eyebrow {
      margin-bottom: 28px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .18em;
      text-transform: uppercase;

      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp .8s ease .25s forwards;
    }

    h1 {
      font-size: clamp(64px, 10vw, 160px);
      font-weight: 300;
      letter-spacing: -.065em;
      line-height: .84;

      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp 1.1s cubic-bezier(.2,.8,.2,1) .38s forwards;
    }

    .location {
      margin-top: 38px;
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);

      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp .8s ease .7s forwards;
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 17px;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      font-size: 11px;
      color: var(--muted);
    }

    .copyright {
      justify-self: start;
    }

    .update {
      justify-self: center;
    }

    .links {
      justify-self: end;
      display: flex;
      gap: 26px;
    }

    .links a {
      color: var(--muted);
      transition: color .25s ease;
    }

    .links a:hover {
      color: var(--text);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes grow {
      to {
        transform: scaleY(1);
      }
    }

    @media (max-width: 700px) {

      .page {
        padding: 24px 22px 22px;
      }

      header {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .role {
        justify-self: start;
      }

      .line {
        top: 14%;
        height: 72%;
      }

      .hero {
        padding-left: 26px;
      }

      h1 {
        font-size: clamp(58px, 18vw, 95px);
        letter-spacing: -.07em;
      }

      footer {
        grid-template-columns: 1fr auto;
        row-gap: 10px;
      }

      .update {
        display: none;
      }

      .links {
        justify-self: end;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <div class="brand">
        Borja Méndez
      </div>

      <div class="role">
        Fotógrafo / Videógrafo
      </div>
    </header>

    <main>

      <div class="line"></div>

      <section class="hero">

        <div class="eyebrow">
          Portfolio
        </div>

        <h1>
          Próximamente<br>
          nuevo trabajo.
        </h1>

        <div class="location">
          Madrid, España
        </div>

      </section>

    </main>

    <footer>

      <div class="copyright">
        © 2026 Borja Méndez
      </div>

      <div class="update">
        Portfolio en actualización.
      </div>

      <div class="links">

        <a
          href="https://www.instagram.com/borjamendezfoto/"
          target="_blank"
          rel="noopener noreferrer">
          Instagram
        </a>

        <a href="mailto:contacto@borjamendez.com">
          Email
        </a>

      </div>

    </footer>

  </div>

</body>
</html>
