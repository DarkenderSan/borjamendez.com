<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Borja Méndez — Photographer / Filmmaker</title>

  <meta name="description" content="Borja Méndez — Photographer / Filmmaker. Website under construction.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #0a0a0a;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
    }

    .name {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .center {
      max-width: 1000px;
    }

    h1 {
      font-size: clamp(54px, 9vw, 140px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin-top: 28px;
      font-size: clamp(16px, 1.5vw, 22px);
      font-weight: 300;
      color: #999;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      font-size: 13px;
      color: #777;
    }

    .links {
      display: flex;
      gap: 24px;
    }

    a {
      color: #aaa;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    a:hover {
      color: #fff;
    }

    @media (max-width: 700px) {
      main {
        padding: 30px 24px;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main>

    <header>
      <div class="name">Borja Méndez</div>
    </header>

    <section class="center">
      <h1>
        Website<br>
        under construction.
      </h1>

      <p class="subtitle">
        Photographer / Filmmaker · Madrid
      </p>
    </section>

    <footer>

      <div>
        © 2026 Borja Méndez
      </div>

      <div class="links">
        <a href="https://www.instagram.com/borjamendezfoto/"
           target="_blank"
           rel="noopener noreferrer">
          Instagram
        </a>

        <a href="mailto:contacto@borjamendez.com>
          Email
        </a>
      </div>

    </footer>

  </main>

</body>
</html>
